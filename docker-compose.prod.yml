services:
  postgres:
    image: postgres:15
    container_name: profitability-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    networks:
      - profitability-backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: profitability-redis
    restart: unless-stopped
    networks:
      - profitability-backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Kafka
  kafka:
    image: apache/kafka:3.7.1
    container_name: profitability-kafka
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@profitability-kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://profitability-kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    networks:
      - profitability-backend


  eureka-server:
    image: ghcr.io/${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/profitability-eureka:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: eureka-server
    restart: unless-stopped
    networks:
      - profitability-backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8761/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  gateway-service:
    image: ghcr.io/${IMAGE_REGISTRY}/profitability-gateway:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - profitability-backend

  auth-service:
    image: ghcr.io/${IMAGE_REGISTRY}/profitability-auth:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profitability_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - profitability-backend

  investment-service:
    image: ghcr.io/${IMAGE_REGISTRY}/profitability-investment:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: investment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profitability_investment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - profitability-backend

  cbr-service:
    image: ghcr.io/${IMAGE_REGISTRY}/profitability-cbr:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: cbr-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profitability_cbr
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - profitability-backend

networks:
  profitability-backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
